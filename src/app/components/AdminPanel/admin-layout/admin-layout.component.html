<div class="parent-container d-flex">
@if (apiStatus.isServerDown()) {
    <app-network-status class="overlay"></app-network-status>
}
@else{
  @if(adminToken()){
  <section class="sideNav vh-100">
    <app-side-nav/>
  </section>
  }
  <section class="main flex-grow-1 vh-100 overflow-auto">
    @if(adminToken()){
     <app-navbar/>
    }
      <app-main class="flex-grow-1"/>
  </section>
}
</div>

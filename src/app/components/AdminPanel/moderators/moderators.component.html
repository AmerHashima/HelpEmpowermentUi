<div class="p-3">
  <div [hidden]="hidden()">
    <app-reusable-material-table
      [columns]="columns"
      [data]="moderators()"
      [totalCount]="total()"
      [pageSize]="pageSize()"
            title="Moderators"

      (pageChange)="onPageChange($event)"
      (filterChange)="onFilterChange($event)"
      (editRow)="handleEdit($event)"
      (deleteRow)="handleDelete($event)"
      (onFirstCellClickChange)="handleSingleModeratorNavigation($event)"
      (onAddNewChange)="handleAddNew()"
    >
    </app-reusable-material-table>
  </div>
  <div>
    <app-moderator-form [hidden]="!hidden()" (cancalEvent)="onCancal()" [oid]="oid"/>
  </div>
</div>

<app-generic-modal
  [isOpen]="isOpen()"
  [title]="isEditMode() ? 'Edit Student' : 'Add Student'"
  (close)="onClose()"
  (isOpenChange)="onClose()"
>
  @if (loading()) {
    <div class="d-flex justify-content-center py-4">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  } @else {
    <div class="mb-2">
      <label class="form-label mb-1">Name *</label>
      <input class="form-control" type="text" [(ngModel)]="formModel.nameEn" />
    </div>

    <!-- <div class="mb-2">
      <label class="form-label mb-1">Name *</label>
      <input class="form-control" type="text" [(ngModel)]="formModel.nameAr" />
    </div> -->

    <div class="mb-2">
      <label class="form-label mb-1">Email *</label>
      <input class="form-control" type="email" [(ngModel)]="formModel.email" />
    </div>

    <div class="mb-2">
      <label class="form-label mb-1">Mobile *</label>
      <input class="form-control" type="text" [(ngModel)]="formModel.mobile" />
    </div>

    <div class="mb-2">
      <label class="form-label mb-1">Username *</label>
      <input class="form-control" type="text" [(ngModel)]="formModel.username" />
    </div>

    <div class="mb-3">
      <label class="form-label mb-1">Password {{ isEditMode() ? '(optional)' : '*' }}</label>
      <input class="form-control" type="password" [(ngModel)]="formModel.password" />
    </div>

    @if (!isEditMode()) {
      <div class="mb-3">
        <label class="form-label mb-1">Confirm Password *</label>
        <input class="form-control" type="password" [(ngModel)]="formModel.confirmPassword" />
      </div>
    }

    @if (errorMessage()) {
      <div class="alert alert-danger py-2" role="alert">
        {{ errorMessage() }}
      </div>
    }

    <div class="d-flex justify-content-end gap-2">
      <button class="btn btn-outline-secondary" type="button" (click)="onClose()">Cancel</button>
      <button class="btn btn-primary" type="button" [disabled]="submitting()" (click)="saveStudent()">
        {{ submitting() ? 'Saving...' : (isEditMode() ? 'Update' : 'Create') }}
      </button>
    </div>
  }
</app-generic-modal>

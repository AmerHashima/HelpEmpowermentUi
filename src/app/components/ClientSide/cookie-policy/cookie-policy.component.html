<div class="policy-container">
  <div class="policy-card">
    <h2>{{ 'cookies.title' | translate }}</h2>
    <div class="section" *ngFor="let section of (sections | async)">
      <h5 *ngIf="section.title">{{ section.title }}</h5>
      <p *ngFor="let paragraph of section.content" class="w-100">{{ paragraph }}</p>
      <ul *ngIf="section.list">
        <li *ngFor="let item of section.list">{{ item }}</li>
      </ul>
    </div>
  </div>
</div>

<main class="article-container" *ngIf="article as item">
  <h1 class="article-title">{{ currentLang() === 'ar' ? item.titleAr : item.titleEn }}</h1>
  <p class="text-muted">{{ item.publishedAt | date }} · {{ item.readingTimeMinutes }} min</p>
  <ng-container *ngFor="let block of item.blocks">
    <h2 *ngIf="block.type === 'main-header'" class="section-title">{{ text(block) }}</h2>
    <h3 *ngIf="block.type === 'sub-header'" class="section-title">{{ text(block) }}</h3>
    <p *ngIf="block.type === 'details'" class="section-content">{{ text(block) }}</p>
    <ul *ngIf="block.type === 'bullet-list'"><li *ngFor="let point of items(block)">{{ point }}</li></ul>
    <ol *ngIf="block.type === 'numbered-list'"><li *ngFor="let point of items(block)">{{ point }}</li></ol>
    <figure *ngIf="block.type === 'image'" class="section-image"><img class="img-fluid rounded" [src]="image(block.imagePath)" [alt]="currentLang() === 'ar' ? block.altAr : block.altEn"><figcaption *ngIf="currentLang() === 'ar' ? block.captionAr : block.captionEn">{{ currentLang() === 'ar' ? block.captionAr : block.captionEn }}</figcaption></figure>
  </ng-container>
</main>

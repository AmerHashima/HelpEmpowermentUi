<section class="enrollForm">
  <ng-content select="[form-title]" class="darkText"></ng-content>
  <section
    class="form w-100 d-flex flex-column align-items-stretch gap-3 rounded mt-3"
  >
      <div class="d-flex flex-column gap-2 w-100">
        <h3 class="m-0">{{ "enroll.enroll" | translate }}</h3>
        <p>{{ "enroll.message" | translate }}</p>
      </div>
    <form #enrollForm="ngForm" (ngSubmit)="onEnroll(enrollForm)" class="enroll-form mb-0">
      <div class="d-flex flex-column gap-3">
        <app-input
          name="fullname"
          [(ngModel)]="enroll.fullname"
          required
          [label]="'enroll.fullnameLabel' | translate"
          [placeholder]="'enroll.fullnamePlaceholder' | translate"
          [icon]="'bi bi-person'"
          [errorMessages]="{
            required: 'Full Name is required' | translate,
          }"
        ></app-input>
        <app-input
          name="organizationname"
          [(ngModel)]="enroll.organizationname"
          required
          [label]="'enroll.organizationnameLabel' | translate"
          [placeholder]="'enroll.organizationnamePlaceholder' | translate"
          [icon]="'bi bi-building'"
          [errorMessages]="{
            required: 'Organization Name is required' | translate,
          }"
        ></app-input>
        <app-input
          name="email"
          [(ngModel)]="enroll.email"
          required
          email
          [label]="'log.emailLabel' | translate"
          [placeholder]="'log.emailPlaceholder' | translate"
          [icon]="'bi bi-envelope'"
          [errorMessages]="{
            required: 'Email is required' | translate,
            email: 'Invalid email format' | translate,
          }"
        ></app-input>

        <app-phone-input
          name="phone"
          [(ngModel)]="enroll.phone"
          [required]="false"
          [labelKey]="'register.phoneLabel' | translate"
        >
        </app-phone-input>
        <app-textarea
          name="notes"
          [(ngModel)]="enroll.notes"
          required
          [label]="'enroll.notesLabel' | translate"
          [placeholder]="'enroll.notesLabel' | translate"
          [icon]="'bi bi-chat-dots'"
          [errorMessages]="{
            required: 'Notes is required' | translate,
          }"
        ></app-textarea>

        <app-site-button
          title="enroll.enrollBtn"
          type="main"
          htmlType="submit"
                        [icon]="'bi bi-arrow'"

        ></app-site-button>
      </div>
    </form>
  </section>
</section>

  <app-generic-modal [(isOpen)]="showConfirm" title="Alert Message">
    <section
      class="w-100 d-flex flex-column align-items-stretch gap-3 p-3 rounded"
    >
      <div
        class="d-flex flex-column align-items-center justify-content-center gap-2 w-100"
      >
        <i class="bi bi-info-circle-fill infoColor"></i>
        <p class="text-center darkText w-75 mx-auto">
          {{
            "You Must be logged to be able to contact us." | translate
          }}
        </p>
      </div>
    </section>
  </app-generic-modal>

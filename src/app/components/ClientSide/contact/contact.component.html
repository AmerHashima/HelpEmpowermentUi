<div>
  <app-page-banner [isRTL]="isRTL()" [media]="true">

  <div content class="d-flex flex-column gap-4">

        <section
        class="form w-100 d-flex flex-column align-items-stretch gap-3 my-4 p-5 rounded"
      >
        <div class="d-flex flex-column gap-2 w-100">
          <h3 class="m-0">{{ "contact.sendUs" | translate }}</h3>
          <p>{{ "contact.anyQuestion" | translate }}</p>
        </div>

        <form
          #contactForm="ngForm"
          (ngSubmit)="onSendContactMessage()"
          class="contact-form mb-0"
        >
          <div class="d-flex flex-column gap-3">
               <app-input
                  name="fullName"
                  [(ngModel)]="contact.fullName"
                  required
                  [label]="'contact.fullNameLabel' | translate"
                  [placeholder]="'contact.fullNamePlaceholder' | translate"
                  [icon]="'bi bi-person'"
                  [errorMessages]="{
                    required: 'Full Name is required' | translate,
                  }"
                ></app-input>
            <app-input
              name="email"
              [(ngModel)]="contact.email"
              required
              email
              [label]="'log.emailLabel' | translate"
              [placeholder]="'log.emailPlaceholder' | translate"
              [icon]="'bi bi-envelope'"
              [errorMessages]="{
                required: 'Email is required' | translate,
                email: 'Invalid email format' | translate,
              }"
            ></app-input>

            <div class="field" [dir]="isRTL() ? 'rtl' : 'ltr'">
              <label for="phone">{{ "register.phoneLabel" | translate }}</label>

              <ngxsmk-tel-input
                name="contact"
                [(ngModel)]="contact.phone"
                #phone="ngModel"
                required
                phoneValidation
                [dir]="isRTL() ? 'rtl' : 'ltr'"
                [preferredCountries]="['EG', 'SA', 'AE', 'US']"
                [initialCountry]="'EG'"
                [i18n]="arabicLabels"
                [localizedCountries]="arabicCountries"
              ></ngxsmk-tel-input>

              <div
                class="error"
                *ngIf="phone?.invalid && (phone?.dirty || phone?.touched)"
              >
                <div *ngIf="phone?.errors?.['required']">
                  {{ "register.phoneRequired" | translate }}
                </div>
                <div *ngIf="phone?.errors?.['invalidNumber']">
                  {{ "register.phoneInvalid" | translate }}
                </div>
              </div>
            </div>

             <app-textarea
                  name="message"
                  [(ngModel)]="contact.message"
                  required
                  [label]="'contact.messageLabel' | translate"
                  [placeholder]="'contact.messageLabel' | translate"
                  [icon]="'bi bi-chat-dots'"
                  [errorMessages]="{
                    required: 'Message is required' | translate,
                  }"
                ></app-textarea>

            <app-site-button
              title="contact.contactBtn"
              type="main"
              htmlType="submit"
              [icon]="isRTL() ? 'bi bi-arrow-left' : 'bi bi-arrow-right'"
              [isRTL]="isRTL()"
            ></app-site-button>
          </div>
        </form>
      </section>

  </div>

  <img media
  src="assets/images/contact/contact.jpeg"
  alt="contactImage"   class="Homebanner-video shadow w-100 h-100">
</app-page-banner>
</div>

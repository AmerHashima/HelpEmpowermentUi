<div class="certificationsExams">
  <div class="d-flex justify-content-center gap-3 flex-grow-1">
    @for (item of visibleItems; track item) {
      <div class="examModeCard d-flex flex-column gap-3 shadow">

        <!-- Header -->
        <div class="d-flex gap-2 align-items-center">
          <div class="header icon">
            <span>
              <!-- exam document icon -->
              <i class="bi bi-file-earmark-text"></i>
            </span>
          </div>

          <div class="d-flex flex-column gap-1">
            <div class="d-flex justify-content-between align-items-center">
              <h3 class="mainTextColor">Exam {{ item }}</h3>
            </div>
          </div>
        </div>

        <!-- Info -->
        <div class="examInfo d-flex align-items-center p-3">

          <!-- Questions -->
          <div
            class="questions d-flex flex-column gap-2 flex-grow-1 align-items-center darkText"
          >
            <div class="d-flex align-items-center gap-1">
              <i class="bi bi-question-circle"></i>
              <span class="title">{{ "common.questions" | translate }}</span>
            </div>
            <span>120</span>
          </div>

          <!-- Duration -->
          <div
            class="d-flex flex-column gap-2 flex-grow-1 align-items-center darkText"
          >
            <div class="d-flex align-items-center gap-1">
              <i class="bi bi-clock"></i>
              <span class="title">{{ "common.duration" | translate }}</span>
            </div>
            <span>230 min</span>
          </div>
        </div>

        <!-- Features -->
        <div class="d-flex align-items-center gap-2 justify-content-center">
          <i class="bi bi-check-circle"></i>
          <span class="darkText">
            {{ "exam.practiceAndExamMode" | translate }}
          </span>
        </div>

        <div class="d-flex align-items-center gap-2 justify-content-center">
          <i class="bi bi-check-circle"></i>
          <span class="darkText">
            {{ "exam.reportsAndLessons" | translate }}
          </span>
        </div>

        <!-- Start Button -->
        <div class="d-flex align-content-center gap-3 w-100">
          <app-site-button
            class="w-100"
            [title]="'common.startNow' | translate"
            [icon]="isRTL() ? 'bi bi-arrow-left' : 'bi bi-arrow-right'"
            type="main"
            (click)="startExam(item)"
          ></app-site-button>
        </div>

      </div>
    }
  </div>
</div>

<!-- Navigation arrows -->
<div class="arrows w-100 pt-3 d-flex justify-content-center align-items-center gap-3">
  <button (click)="prev()" [disabled]="!canGoPrev">
    <i class="bi bi-chevron-left"></i>
  </button>

  <button (click)="next()" [disabled]="!canGoNext">
    <i class="bi bi-chevron-right"></i>
  </button>
</div>

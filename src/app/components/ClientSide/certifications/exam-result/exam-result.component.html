<div class="parent-container">
  <!-- Header -->
  <header
    class="exam-header flex-column justify-content-center flex-lg-row gap-2"
  >
    <span class="fw-bold fs-5">{{ "Exam Evaluation" | translate }}</span>
  </header>
  <!-- Question area -->
  <main class="question-area">
    <div class="container-fluid mb-3 border">
      <div class="row">
        <div class="col-12">
          <div class="row">
            <div class="col-6 overAllResult text-center p-3">
              <span>{{ "Overall Result" | translate }}</span>
            </div>
            <div class="col-6 border-start text-center pass p-3">
              <span>{{
                (examResult() && examResult().isPassed ? "Passed" : "Failed") | translate
              }}</span>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="row">
            <div class="col-6 p-3 text-center performanceLevel">
              <span>{{ "Performance Level" | translate }}</span>
            </div>
            <div
              class="col-6 border-start p-3 level text-center"
              [ngClass]="scoreCategory()"
            >
              <span>
                {{ scoreLabel() | translate }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
        @if(cert() == 'capm'){
   <app-capm-performace-table/>
    }
    @else{
    <app-performance-indicators-table />
    }
    <!-- <app-performance-indicators-table /> -->
    <div class="d-flex justify-content-end">
        <app-site-button
          title="Done"
          type="main"
          (click)="Done()"
        />
    </div>
  </main>
</div>

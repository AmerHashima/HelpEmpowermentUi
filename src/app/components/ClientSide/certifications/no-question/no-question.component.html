<div class="empty-state d-flex flex-column align-items-center justify-content-center text-center p-5">

  <div class="empty-icon mb-3">
    <i class="bi bi-journal-x"></i>
  </div>

  <h4 class="fw-semibold mb-2">
    {{ 'exam.empty.title' | translate }}
  </h4>

  <p class="text-muted mb-4">
    @if (mode() === 'Exam') {
      {{ 'exam.empty.examMessage' | translate }}
    } @else {
      {{ 'exam.empty.practiceMessage' | translate }}
    }
  </p>

  <div class="d-flex gap-2">

    <app-site-button
      [title]="'common.back' | translate"
      type="main"
      (click)="onBack()"
    />

    @if(page() != 'lessonLearned'){
   <app-site-button
      [title]="'common.retry' | translate"
      type="secondary"
      (click)="onRetry()"
    />
    }


  </div>

</div>

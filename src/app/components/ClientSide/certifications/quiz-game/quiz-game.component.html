      <h3 class="CertificationHeader">
        <span class="darkText">
          {{ quizGameContent().master | translate }}
        </span>
        <span class="mainTextColor">
          {{ quizGameContent().title | translate }}
        </span>
      </h3>

      <p>
        {{ quizGameContent().description | translate }}
      </p>

      <div class="d-flex align-content-center gap-3">
        <app-site-button
          [title]="quizGameContent().play"
          [icon]="'bi bi-arrow'"
          type="main"
          (click)="playNow()"
        ></app-site-button>
      </div>
    </div>
  </div>

  <img
    media
    [src]="courseImage"
    alt="contact Image"
    class="Homebanner-video shadow w-100 h-100"
  />
</app-page-banner>

   <app-generic-modal [(isOpen)]="showMustLogin" [title]="'exam.alertMessage' | translate">

        <i class="bi bi-info-circle-fill infoColor"></i>
        <p class="text-center darkText w-75 mx-auto">
          {{ "quizGame.mustLogin" | translate }}
        </p>
      </div>

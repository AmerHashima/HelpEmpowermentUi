<div class="container-fluid">
  <div class="row g-3">
    <div class="col-12">
      <h5 class="mainTextColor fw-bold">Exam 1 Reports</h5>
      <p>{{ "Review Your Previous Exam Attempts" | translate }}</p>
    </div>
    <div class="col-12">
      <div class="row">
        <div class="col-6">
          <div
            class="reportScoreCard gap-3 d-flex align-items-center p-3 rounded-3 shadow-sm"
          >
            <span class="icon rounded-3 p-3">
              <i class="bi bi-journal-check"></i>
            </span>
            <div class="d-flex flex-column gap-1">
              <h6 class="darkText fw-bold">Total Exam Number</h6>
              <span class="fw-light">{{reports().length}}</span>
            </div>
          </div>
        </div>
        <div class="col-6">
          <div
            class="reportScoreCard gap-3 d-flex align-items-center p-3 rounded-3 shadow-sm"
          >
            <span class="icon rounded-3 p-3">
              <i class="bi bi-trophy"></i>
            </span>
            <div class="d-flex flex-column gap-1">
              <h6 class="darkText fw-bold">Average Score</h6>
              <span class="fw-light">{{averageScore()}}%</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12">
      <div class="row">
        <div class="col-12">
          <h5 class="mainTextColor fw-bold">Exam Reports</h5>
        </div>
        @for (report of reports(); track report; let index = $index) {
          <div class="col-12">
            <div class="reportCard">
              <app-exam-report-card
                [report]="{
                title: 'Exam Report ' + (index + 1),
                date: formatDate(report.startedAt),
                duration: getDurationInMinutes(report.startedAt, report.finishedAt),
                correct: report.obtainedScore,
                incorrect: 84,
                obtainedScore:report.obtainedScore,
                notAnswered: 2,
                isPassed: report.isPassed,
              }"
                (viewLessons)="onViewLessons()"
                (checkPerformance)="onCheckPerformance()"
              />
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>

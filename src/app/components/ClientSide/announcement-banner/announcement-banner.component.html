@if (currentAnnouncement; as announcement) {

  <div class="announcement-bar">

    <div class="announcement-content">

      @if (announcement.icon) {

        <div class="announcement-icon">

          <i [class]="announcement.icon"></i>

        </div>

      }

      <div class="announcement-text">

        @if (announcement.title) {

          <strong class="announcement-title">{{ announcementText(announcement.title) }}</strong>

        }

        <span class="ms-2">{{ announcementText(announcement.message) }}</span>

      </div>

    </div>

  </div>

}

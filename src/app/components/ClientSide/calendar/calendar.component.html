<div class="d-flex flex-column gap-3">
  <app-page-banner [isRTL]="isRTL()" [media]="true" [isGrow]="false">
    <div content class="d-flex flex-column gap-3 pe-xl-5">
      <h6 class="mb-0 fw-bold">
        {{ "calendar.unlockMessage" | translate }}
      </h6>
      <h5 class="mb-0 fw-bold mainTextColor">
        {{ "calendar.upcomingEvents" | translate }}
      </h5>

      <div class="calendarGrid row px-0 g-3">
        @for (item of calendarData(); let i = $index; track item) {
          <div class="col-6">
            <app-calendar-card
              [title]="item.title"
              [icon]="item.icon"
              [startDate]="item.startDate"
              [endDate]="item.endDate"
              (cardClick)="onCardClick(item)"
            ></app-calendar-card>
          </div>
        } @empty {
          <div class="col-12">
            <div
              class="empty-calendar-state d-flex flex-column align-items-center justify-content-center text-center p-5 rounded-4 border"
            >
              <div class="empty-icon mb-4">
                <i class="bi bi-calendar-event fs-1"></i>
              </div>

              <h4 class="fw-bold mb-3 darkText">
                {{ "calendar.noEventsTitle" | translate }}
              </h4>

              <p class="text-muted mb-0 col-lg-6">
                {{ "calendar.noEventsDescription" | translate }}
              </p>
            </div>
          </div>
        }
      </div>
    </div>

    <img
      media
      src="assets/images/calendar/calendar.jpeg"
      alt="contactImage"
      class="Homebanner-video shadow w-100 h-100"
    />
  </app-page-banner>
</div>

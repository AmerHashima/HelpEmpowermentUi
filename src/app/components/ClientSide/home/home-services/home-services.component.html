<div class="services-slider container-fluid certificationsExams">

  <button class="arrow arrow-left" (click)="prev()" [disabled]="!canGoPrev()">
    <i class="bi bi-chevron-left"></i>
  </button>

  <div class="row g-3 cards-wrapper">
    @for (item of visibleItems(); track item.title) {
      <div class="col-4 d-flex">
        <app-icon-card
          (click)="goToService(item)"
          class="home-service flex-fill"
          [title]="item.title"
          [description]="item.description"
          [icon]="item.icon"
        ></app-icon-card>
      </div>
    }
  </div>

  <button class="arrow arrow-right" (click)="next()" [disabled]="!canGoNext()">
    <i class="bi bi-chevron-right"></i>
  </button>

</div>

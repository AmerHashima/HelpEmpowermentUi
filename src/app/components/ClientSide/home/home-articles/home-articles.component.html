<div class="container-fluid pt-4">

  @if (type() === 'home') {
    <div class="services-slider certificationsExams"
      (mouseenter)="stopAutoSlide()"
  (mouseleave)="startAutoSlide()">

      <button class="arrow arrow-left" (click)="prev()" [disabled]="!canGoPrev()">
        <i class="bi bi-chevron-left"></i>
      </button>

      <div class="row g-3 cards-wrapper">
        @for (article of visibleArticles(); track article.slug) {
          <div class="col-12 col-md-6 col-lg-4">
            <app-article-card
              [imgSrc]="article.imgSrc"
              [imgAlt]="article.imgAlt"
              [date]="article.date"
              [publishTime]="article.publishTime"
              [title]="article.title"
              [description]="article.description"
              (onClick)="onArticleClick(article, $index)"
            />
          </div>
        }
      </div>

      <button class="arrow arrow-right" (click)="next()" [disabled]="!canGoNext()">
        <i class="bi bi-chevron-right"></i>
      </button>

    </div>
  }

  @else {
    <div class="row g-3">
      @for (article of articlesData(); track $index) {
        <div class="col-12 col-md-6 col-lg-4">
          <app-article-card
            [imgSrc]="article.imgSrc"
            [imgAlt]="article.imgAlt"
            [date]="article.date"
            [publishTime]="article.publishTime"
            [title]="article.title"
            [description]="article.description"
            (onClick)="onArticleClick(article, $index)"
          />
        </div>
      } @empty {
        <div class="text-center py-5 text-muted fs-5">
          {{ 'No articles available at the moment' | translate }}
        </div>
      }
    </div>
  }

</div>

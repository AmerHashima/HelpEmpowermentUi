<div class="custom-checkbox-wrapper">
  <input
    type="checkbox"
    [id]="id()"
    [checked]="internalChecked()"
    (change)="onCheckboxChange($event)"
    class="custom-checkbox"
    [disabled]="disabled()"
  />
  <label [htmlFor]="id()" class="checkbox-label">
    {{ label() }}
  </label>
</div>

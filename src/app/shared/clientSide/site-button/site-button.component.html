
<button
  type="{{ htmlType() }}"
  class="btn d-flex align-items-center justify-content-center w-100"
  [ngClass]="{
    'btn-primary': type() === 'main' && !isMarked(),
    'btn-outline-primary': type() === 'secondary',
    'bg-warning text-dark': isMarked(),
    'custom-class': customClass()
  }"
  [disabled]="disabled()"
  [style]="{
    'direction': isRTL() ? 'rtl' : 'ltr',
    'display': 'flex',
    'align-items': 'center',
    'gap': '0.5rem'
  }"
  (click)="onClick.emit()"
>


  @if (icon() && getIconPosition() === 'start') {
  <i [class]="getComputedIcon()"></i>
}

<span>{{ title() | translate }}</span>

@if (icon() && getIconPosition() === 'end') {
  <i [class]="getComputedIcon()"></i>
}


</button>

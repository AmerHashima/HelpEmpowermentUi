<div
  class="certification-card articleCard shadow h-100 d-flex flex-column"
  [class.rtl]="isRTL()"
  (click)="onClick.emit()"
>
@if(showIcons()){
  <div  class="card-actions d-flex gap-2">
    <i class="bi bi-pencil-square edit-icon" (click)="onEdit($event)"></i>
    <i class="bi bi-trash delete-icon" (click)="onDelete($event)"></i>
  </div>
}

  <!-- Image -->
  <div class="certification-image">
    <img [src]="imgSrc()" [alt]="imgAlt() | translate" />
  </div>

  <!-- Content -->
  <!-- <div class="certfication-content d-flex flex-column bg-info  gap-3 p-3"> -->
  <div class="certfication-content d-flex flex-column gap-3 p-3 flex-grow-1">
    <!-- Date & time -->
    <div class="date d-flex align-items-center gap-2 small">
      <span>{{ date() | translate }}</span>
      <span>·</span>
      <span>{{ publishTime() | translate }}</span>
    </div>

    <!-- Title & description -->
    <div class="d-flex flex-column justify-content-between flex-grow-1 gap-3">
      <div class="d-flex flex-column gap-1">
        <h3 class="articleName courseName mb-1">
          {{ title() | translate }}
        </h3>
        <p class="articleDesc w-100 mb-0">
          {{ description() | translate }}
        </p>
      </div>

      <!-- Read more link -->
      <div
        class="learnMore d-flex align-items-center justify-content-end gap-2"
        role="button"
        tabindex="0"
        (click)="onClick.emit()"
        (keyup.enter)="onClick.emit()"
      >
        <span>{{ "common.readMore" | translate }}</span>
        <i [ngClass]="isRTL() ? 'bi bi-arrow-left' : 'bi bi-arrow-right'"></i>
      </div>
    </div>
  </div>
</div>

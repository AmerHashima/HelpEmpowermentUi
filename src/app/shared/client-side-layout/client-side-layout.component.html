<div class="d-flex h-100 flex-column justify-content-between">
  @if (isFullPage) {
    <!-- Full page mode (no navbar/footer/banner) -->
    <div class="top-bar d-flex justify-content-center py-3">
      <div (click)="navigateHome()">
        <img
          src="assets/images/clientNavbar/logo.png"
          alt="Logo"
          class="logo"
        />
      </div>
    </div>
    <div class="mainContainer" [class.fullPage]="isFullPage">
      <div class="page-width">
        <app-client-main-layout />
      </div>
    </div>
    <app-footer />
  } @else {
    <!-- Normal layout -->
    <div class="flex-grow-1 d-flex flex-column">
      <app-client-navbar />
      <div class="mainContainer">
        <!-- Optional banner (skip on no-layout routes) -->
        @if (!isNoLayout) {
          <div class="pagesBanner">
            <span>{{ "pages." + pageKey | translate }}</span>
          </div>
        }

        <div class="page-width">
          <app-client-main-layout />
        </div>
      </div>
      <app-footer />
    </div>
  }
</div>

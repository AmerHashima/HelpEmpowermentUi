<!-- src\app\shared\phone\phone.component.html -->
<div class="field" [dir]="isRTL() ? 'rtl' : 'ltr'">
  <label for="phone">
    {{ labelKey | translate }}
    <span *ngIf="required" class="text-danger">*</span>
  </label>
  <ngxsmk-tel-input
  name="phone"
  [(ngModel)]="value"
  (ngModelChange)="onValueChange($event)"
  #phoneInput="ngModel"
  [required]="required"
  [dir]="isRTL() ? 'rtl' : 'ltr'"
  [preferredCountries]="preferredCountries"
  [initialCountry]="initialCountry"
  [i18n]="arabicLabels"
  [localizedCountries]="arabicCountries"
  [disabled]="disabled"
  [nationalMode]="false"
  [separateDialCode]="true"
  [allowDropdown]="true"
  [formatAsYouType]="true"
  [digitsOnly]="false"
></ngxsmk-tel-input>

  <!-- Required error – only if touched and still empty -->
  <div
    class="error text-danger small mt-1"
    *ngIf="
      phoneInput?.touched &&
      phoneInput?.invalid &&
      phoneInput?.errors?.['required']
    "
  >
    {{ "register.phoneRequired" | translate }}
  </div>

  <!-- Invalid number/format error – only if touched -->
  <div
    class="error text-danger small mt-1"
    *ngIf="
      phoneInput?.touched &&
      phoneInput?.invalid &&
      phoneInput?.errors?.['invalidNumber']
    "
  >
    {{ "register.phoneInvalid" | translate }}
  </div>

  <!-- You can add more specific errors if the lib exposes them, e.g. -->
  <!-- *ngIf="phoneInput?.touched && phoneInput?.errors?.['phoneInvalidCountryCode']" -->
  <!-- etc. – check browser dev tools or //console.log(phoneInput.errors) to see available keys -->
</div>

<footer
  class="footer-parent d-flex flex-column align-content-center justify-content-center gap-2"
>
  <div class="footer-video d-flex align-items-center justify-content-center">
    <img [src]="footerImage" [alt]="'footer.image' | translate" />
  </div>

  <div class="checker-mover"></div>

  <div class="footer-content">
    <div
      class="page-width flex-column flex-lg-row d-flex justify-content-between align-items-center"
    >
      <p class="w-100 text-start">
        {{ "footer.copyright" | translate }}
      </p>
      <p class="d-flex justify-content-end gap-2 w-100">
        <span>
          <a [routerLink]="['/', currentLang(), 'refund-policy']">
            {{ "footer.refundPolicy" | translate }}
          </a>
        </span>
        <span>
          <a [routerLink]="['/', currentLang(), 'privacy-notice']">
            {{ "footer.privacyNotice" | translate }}
          </a>
        </span>
        <span>
          <a [routerLink]="['/', currentLang(), 'user-account-policy']">
            {{ "footer.userAccountPolicy" | translate }}
          </a>
        </span>
        <span>
          <a [routerLink]="['/', currentLang(), 'technical-support-policy']">
            {{ "footer.technicalSupportPolic" | translate }}
          </a>
        </span>
      </p>
    </div>
  </div>
</footer>

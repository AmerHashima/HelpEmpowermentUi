<div class="row h-100">
  <div class="col-12 h-100">
    <div class="card custom-card mb-0 h-100">
      <div class="card-body h-100 d-flex flex-column">
        <file-pond #myPond class="flex-grow-1 h-100"
          [options]="pondOptions"
          [files]="pondFiles"
          (oninit)="pondHandleInit()"
          (onaddfile)="pondHandleAddFile()"
          (onremovefile)="pondHandleRemoveFile()">
        </file-pond>
      </div>
    </div>
  </div>
</div>
